<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Diagnóstico · Cenlo Food</title><meta name="theme-color" content="#F7F2EA"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f2ea;--paper:#fffdfa;--ink:#211c19;--muted:#746a63;--line:#e7dbd0;--brand:#c0532e;--brand2:#9f4024;--soft:#f3e2d8;--ok:#426c4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,sans-serif}.top{max-width:1050px;margin:auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}.logo{width:25px;height:25px;border:3px solid var(--brand);border-right-color:transparent;border-radius:50%;position:relative}.logo:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--brand);left:9px;top:6px}.micro{font-size:13px;color:var(--muted)}main{padding:8px 16px 48px;display:grid;place-items:center}.card{width:min(900px,100%);background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 70px rgba(75,44,27,.12);overflow:hidden}.hero{padding:28px;border-bottom:1px solid var(--line)}.tag{display:inline-flex;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--brand2);font-size:13px;font-weight:700}.hero h1{font-size:clamp(31px,5vw,50px);line-height:.99;letter-spacing:-.045em;margin:17px 0 11px;max-width:760px}.hero p{color:var(--muted);font-size:16px;max-width:690px;margin:0}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:24px}.progress i{height:5px;border-radius:99px;background:#ecdfd5}.progress i.on{background:var(--brand)}.body{padding:28px}.step{display:none}.step.on{display:block}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--brand2)}h2{font-size:clamp(25px,4vw,36px);line-height:1.05;letter-spacing:-.03em;margin:8px 0}.sub{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.opt{border:1px solid var(--line);background:#fff;border-radius:15px;padding:16px;text-align:left;cursor:pointer;min-height:80px;transition:.15s}.opt:hover{transform:translateY(-1px);border-color:#d5b09d}.opt.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(192,83,46,.11);background:#fff9f5}.opt b{display:block;font-size:16px}.opt small{color:var(--muted);line-height:1.3;display:block;margin-top:4px}.field{margin-top:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;outline:none;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.check{display:flex;gap:9px;font-size:13px;color:var(--muted);margin-top:12px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:26px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.ghost{background:#eee5dd}.primary{background:var(--brand);color:#fff}.primary:disabled{opacity:.4}.result{display:none}.result.on{display:block}.rhero{padding:28px;border-radius:19px;background:linear-gradient(135deg,#281c17,#46271b);color:#fff}.rhero p{color:#eadbd2}.cols{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;margin-top:14px}.panel{border:1px solid var(--line);background:#fff;border-radius:16px;padding:19px}.panel h3{margin:0 0 10px}.panel p{color:var(--muted)}.line{display:flex;gap:10px;padding:10px 0;border-top:1px solid #f2e7df}.line:first-child{border-top:0}.dot{width:20px;height:20px;border-radius:6px;background:var(--soft);display:grid;place-items:center;color:var(--brand2);font-weight:800;flex:0 0 auto}.nexts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.next{border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px;text-align:left;cursor:pointer}.next.sel{border-color:var(--brand);background:#fff8f4}.next b{display:block}.next small{color:var(--muted)}.contact{display:none;margin-top:14px}.contact.on{display:block}.status{font-size:13px;min-height:18px;margin-top:9px;color:var(--muted)}.status.ok{color:var(--ok)}.status.err{color:#9a3428}@media(max-width:700px){.micro{display:none}.card{border-radius:20px}.hero,.body{padding:21px}.grid,.cols,.nexts{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style></head><body><header class="top"><div class="brand"><span class="logo"></span>Cenlo Food</div><div class="micro">Diagnóstico da operação · cerca de 2 minutos</div></header><main><section class="card"><div class="hero"><span class="tag" id="tag">Diagnóstico Cenlo Food</span><h1 id="title">O que precisa mudar para a sua pizzaria vender direto sem virar mais trabalho?</h1><p id="intro">Responda sobre a operação atual. No final, mostramos a configuração que faz sentido antes de pedir qualquer contato.</p><div class="progress" id="progress"></div></div><div class="body"><div id="steps"></div><div id="result" class="result"></div></div></section></main>
<script>
const API='https://api-crm.cenlo.pt/crm/public/diagnostics',VERSION='food-diagnostic-v2',q=new URLSearchParams(location.search),club=['clube','fidelidade','loyalty'].includes((q.get('entry')||'').toLowerCase());
if(club){tag.textContent='Clube de fidelidade · Diagnóstico';title.textContent='A sua pizzaria consegue transformar um primeiro pedido em motivo para o próximo?';intro.textContent='Veja como fidelização pode entrar no mesmo fluxo de pedidos, clientes e operação do Cenlo Food.'}
const A={modelo:'',negocio:'',canal:'',sistema:'',manterSistema:false,prioridade:club?'retorno':'',retorno:'',usaClube:false,necessidades:club?['clube']:[],contexto:'',proximoPasso:''};let s=0;
const S=[
['Como funciona hoje?','Começamos pelo modelo da operação, não pela tecnologia.','modelo',[['delivery','Delivery ou retirada','A maior parte acontece fora do salão.'],['salao','Atendimento no salão','A operação gira principalmente à volta das mesas.'],['misto','Delivery e salão','Os dois fluxos acontecem ao mesmo tempo.'],['abertura','Estou preparando a abertura','A operação ainda está sendo montada.'],['outro','Outro modelo de operação','O seu caso não cabe bem nas opções acima.']]],
['Por onde entram os pedidos?','E o que precisa continuar funcionando junto com o Cenlo.','canal',[['whatsapp','WhatsApp ou telefone','A conversa ainda é central.'],['site','Site ou link de pedidos','O cliente já compra por um canal próprio.'],['marketplace','Marketplace','A maior parte ainda chega por plataforma.'],['balcao','Balcão ou salão','O pedido começa dentro do estabelecimento.'],['misto','Vários canais','A operação junta entradas diferentes.']]],
['O que quer resolver primeiro?','A recomendação muda de acordo com a prioridade.','prioridade',[['retorno','Fazer o cliente voltar','Criar recorrência sem depender só de promoções soltas.'],['direto','Fortalecer pedidos diretos','Depender menos de plataformas e canais dispersos.'],['operacao','Organizar pedidos e cozinha','Reduzir retrabalho entre atendimento e produção.'],['tempo','Poupar tempo no atendimento','Tirar tarefas repetitivas da equipa.']]],
['O que precisa estar na sua configuração?','Pode marcar mais de uma opção. Não precisa saber o nome do plano.','necessidades',[['clube','Clube de fidelidade','Pontos, recompensas, missões e níveis ligados aos clientes.'],['pedidos','Pedidos diretos','Site e fluxo próprio para receber pedidos.'],['cozinha','Organização da cozinha','Pedido segue até à preparação.'],['assistente','Assistente no WhatsApp','Orientação e tarefas repetitivas no canal da loja.'],['mesa','Pedidos na mesa','Fluxo presencial para o salão.'],['integracao','Avaliar integração','Preservar o sistema atual e verificar como os fluxos convivem.'],['ajuda','Quero ver antes de escolher','Prefiro uma demonstração para decidir.']]],
['Tem algo indispensável para funcionar?','Use este espaço para um requisito que possa mudar a recomendação.','contexto',[]]
];
const P={retorno:'Fazer o cliente voltar',direto:'Fortalecer pedidos diretos',operacao:'Organizar pedidos e cozinha',tempo:'Poupar tempo no atendimento'};
function esc(x){return String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function valid(){if(s===4)return true;if(s===3)return A.necessidades.length>0;return !!A[S[s][2]]}
function draw(){progress.innerHTML=S.map((_,i)=>'<i class="'+(i<=s?'on':'')+'"></i>').join('');steps.innerHTML=S.map((x,i)=>'<section class="step '+(i===s?'on':'')+'"><div class="eyebrow">Etapa '+(i+1)+' de 5</div><h2>'+x[0]+'</h2><p class="sub">'+x[1]+'</p>'+body(i,x)+'<div class="actions"><button class="btn ghost" '+(i===0?'style="visibility:hidden"':'')+' onclick="back()">Voltar</button><button class="btn primary" '+(!valid()&&i===s?'disabled':'')+' onclick="next()">'+(i===4?'Ver minha indicação':'Continuar')+'</button></div></section>').join('')}
function body(i,x){if(i===4)return '<div class="field"><label>Contexto adicional</label><textarea maxlength="400" placeholder="Ex.: preciso manter o POS atual, tenho duas áreas..." oninput="A.contexto=this.value">'+esc(A.contexto)+'</textarea></div>';
let g='<div class="grid">'+x[3].map(o=>'<button class="opt '+sel(x[2],o[0],i===3)+'" onclick="choose(\''+x[2]+'\',\''+o[0]+'\','+(i===3)+')"><b>'+o[1]+'</b><small>'+o[2]+'</small></button>').join('')+'</div>';
if(i===0)g+='<div class="field"><label>Nome da pizzaria ou negócio <span style="font-weight:500;color:var(--muted)">opcional</span></label><input maxlength="160" value="'+esc(A.negocio)+'" oninput="A.negocio=this.value"></div>';
if(i===1)g+='<div class="field"><label>Sistema atual <span style="font-weight:500;color:var(--muted)">opcional</span></label><input maxlength="160" value="'+esc(A.sistema)+'" placeholder="Ex.: Zone Soft, outro POS, nenhum" oninput="A.sistema=this.value"></div><label class="check"><input type="checkbox" '+(A.manterSistema?'checked':'')+' onchange="A.manterSistema=this.checked"> Preciso manter o sistema atual na operação.</label>';
if(i===2)g+='<div class="field"><label>Hoje consegue identificar quem voltou a comprar?</label><select onchange="A.retorno=this.value;draw()"><option value="">Selecione</option><option value="organizado" '+(A.retorno==='organizado'?'selected':'')+'>Sim, de forma organizada</option><option value="manual" '+(A.retorno==='manual'?'selected':'')+'>Consigo, mas preciso procurar</option><option value="nenhum" '+(A.retorno==='nenhum'?'selected':'')+'>Ainda não consigo acompanhar</option><option value="inicio" '+(A.retorno==='inicio'?'selected':'')+'>Ainda vou começar a receber pedidos</option></select></div><label class="check"><input type="checkbox" '+(A.usaClube?'checked':'')+' onchange="A.usaClube=this.checked"> Já uso algum programa de fidelidade.</label>';
return g}
function sel(k,v,m){return m?A.necessidades.includes(v)?'sel':'':A[k]===v?'sel':''}
function choose(k,v,m){if(m){let a=A.necessidades;if(v==='ajuda')a=a.includes('ajuda')?[]:['ajuda'];else{a=a.filter(y=>y!=='ajuda');a=a.includes(v)?a.filter(y=>y!==v):[...a,v]}A.necessidades=a}else A[k]=v;draw()}
function next(){if(!valid())return;if(s<4){s++;draw();scrollTo(0,0)}else show()}
function back(){if(s){s--;draw()}}
function rec(){if(A.necessidades.includes('ajuda'))return['Vale começar por uma demonstração orientada','Há informação suficiente para entender a prioridade, mas não para fechar uma configuração sem mostrar os fluxos lado a lado.',['Demonstração focada em '+P[A.prioridade].toLowerCase(),'Mapear o sistema e os canais que precisam continuar','Definir a configuração depois de ver o fluxo real']];
let it=[];if(A.necessidades.includes('clube'))it.push('Clube de fidelidade ligado ao cadastro e ao histórico de clientes');if(A.necessidades.includes('pedidos'))it.push('Canal de pedidos diretos ligado à mesma operação');if(A.necessidades.includes('cozinha'))it.push('Fluxo operacional do pedido até a cozinha');if(A.necessidades.includes('assistente'))it.push('Assistente no WhatsApp para tarefas repetitivas');if(A.necessidades.includes('mesa'))it.push('Fluxo de pedidos presenciais na mesa');if(A.necessidades.includes('integracao')||A.manterSistema)it.push('Validação da integração com o sistema atual antes de qualquer troca');return[A.prioridade==='retorno'?'A sua prioridade pede relacionamento ligado à operação':'A configuração deve partir do fluxo que já existe',A.prioridade==='retorno'?'O clube faz mais sentido quando não fica isolado num cartão de pontos. A proposta é ligar fidelidade ao mesmo histórico que acompanha pedidos e clientes.':'O Cenlo entra para organizar o ponto escolhido sem obrigar a substituir o que já funciona.',it]}
function show(){steps.style.display='none';progress.style.display='none';let r=rec();result.className='result on';result.innerHTML='<div class="rhero"><span class="tag">Indicação a partir das suas respostas</span><h2>'+r[0]+'</h2><p>'+r[1]+'</p></div><div class="cols"><div class="panel"><h3>O que faz sentido avaliar</h3>'+r[2].map(x=>'<div class="line"><span class="dot">✓</span><span>'+x+'</span></div>').join('')+'</div><div class="panel"><h3>Prioridade principal</h3><p><b>'+P[A.prioridade]+'</b></p><p>Este resultado não promete faturação nem substitui a validação da operação.</p></div></div><div class="panel" style="margin-top:14px"><h3>Como quer avançar?</h3><p>Você pode ver este resultado sem deixar telefone.</p><div class="nexts">'+[['demo','Quero ver funcionando','Uma demonstração curta.'],['investimento','Quero entender o investimento','Discutir configuração e valores.'],['depois','Prefiro retomar depois','Voltar quando fizer sentido.']].map(x=>'<button class="next" data-n="'+x[0]+'" onclick="pick(\''+x[0]+'\')"><b>'+x[1]+'</b><small>'+x[2]+'</small></button>').join('')+'</div><div id="contact" class="contact"><div class="grid"><div class="field"><label>Primeiro nome</label><input id="name"></div><div class="field"><label>Pizzaria ou negócio</label><input id="company" value="'+esc(A.negocio)+'"></div></div><div class="field"><label>WhatsApp</label><input id="phone" inputmode="tel" placeholder="+351 9xx xxx xxx"></div><label class="check"><input id="consent" type="checkbox"> Autorizo o Cenlo a me chamar no WhatsApp sobre este diagnóstico.</label><button class="btn primary" style="margin-top:14px" onclick="send()">Enviar e continuar</button><div id="status" class="status"></div></div><p class="micro">O escopo final depende da configuração validada. Não mostramos um plano provisório como recomendação fechada.</p></div>';scrollTo(0,0)}
function pick(v){A.proximoPasso=v;document.querySelectorAll('.next').forEach(e=>e.classList.toggle('sel',e.dataset.n===v));contact.classList.toggle('on',v!=='depois');if(v!=='depois')phone.focus()}
async function compatible(){try{let r=await fetch(API+'/versions');if(!r.ok)return false;let j=await r.json();return j.versions&&j.versions.includes(VERSION)}catch{return false}}
async function send(){let st=status,p=phone.value.trim();if(!p||!consent.checked){st.className='status err';st.textContent='Preencha o WhatsApp e autorize o contato.';return}st.className='status';st.textContent='A enviar…';if(!(await compatible())){st.className='status err';st.textContent='O envio está temporariamente indisponível. O resultado continua visível.';return}let id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);let utm={source:q.get('utm_source'),medium:q.get('utm_medium'),campaign:q.get('utm_campaign'),content:q.get('utm_content'),term:q.get('utm_term')};let body={vertical:'food',schemaVersion:VERSION,submissionId:id,answers:A,lead:{name:name.value.trim()||null,company:company.value.trim()||null,phone:p,consent:true},utm,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,pageUrl:location.href,website:''};try{let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(r.status===201&&j.saved&&j.submissionId===id){st.className='status ok';st.textContent='Recebido. Vamos usar estas respostas no próximo passo.'}else throw 0}catch{st.className='status err';st.textContent='Não conseguimos enviar agora. Tente novamente em instantes.'}}
draw();
</script></body></html>
