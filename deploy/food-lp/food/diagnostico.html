<style>
  :root {
    --bg: #F7F5F1;
    --surface: #FFFFFF;
    --ink: #16181D;
    --ink-2: #3A3D44;
    --muted: #6B7280;
    --line: #E9E7E1;
    --line-2: #DEDBD4;
    --accent: #B9471F;
    --accent-hover: #9E3C1A;
    --ok: #2F6B4F;
    --err: #B3261E;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    color: var(--ink);
    background: var(--bg);
    font-family: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16.5px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(214,86,40,.22); }
  :focus-visible { outline: 3px solid #D65628; outline-offset: 2px; border-radius: 4px; }
  a { color: var(--accent); }
  .top { position: sticky; top: 0; z-index: 2; background: rgba(247,245,241,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 900px; margin: 0 auto; padding: 0 20px; height: 64px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand b { font-family: 'Schibsted Grotesk', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: -0.5px; color: var(--ink); }
  .brand b span { color: var(--accent); }
  .stage { font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .close { margin-left: auto; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; color: var(--muted); }
  .close:hover { background: #F2F0EA; color: var(--ink); }
  .segs { max-width: 900px; margin: 0 auto; padding: 0 20px 12px; display: flex; gap: 4px; }
  .segs span { flex: 1; height: 3px; border-radius: 99px; background: var(--line); transition: background .4s ease; }
  .segs span.on { background: var(--accent); }
  main { max-width: 900px; margin: 0 auto; padding: clamp(28px,5vw,52px) 20px calc(40px + env(safe-area-inset-bottom)); min-height: calc(100vh - 210px); display: flex; flex-direction: column; justify-content: center; }
  main > * { max-width: 100%; }
  #app { position: relative; isolation: isolate; }
  .ghost { position: absolute; margin: 0 !important; pointer-events: none; z-index: -1; }
  h1, h2, legend { font-family: 'Schibsted Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
  h1, legend.big { font-size: clamp(25px, 3.4vw, 38px); margin: 0 0 10px; }
  h2 { font-size: clamp(21px, 2.6vw, 27px); margin: 0 0 10px; }
  h1:focus, h2:focus, legend:focus { outline: none; }
  p { margin: 0 0 12px; }
  .counter { margin: 0 0 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .lead { font-size: 17px; color: var(--ink-2); max-width: 640px; text-wrap: pretty; }
  fieldset { border: 0; margin: 0 0 22px; padding: 0; min-width: 0; }
  legend { padding: 0; }
  fieldset.sub legend { font-size: 19px; margin-bottom: 6px; }
  .type { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .help { margin: 0 0 6px; font-size: 16.5px; color: var(--ink-2); max-width: 640px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 18px; }
  .opt { position: relative; display: flex; align-items: flex-start; gap: 13px; padding: 17px 18px; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; transition: background .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .opt:hover { border-color: rgba(214,86,40,.55); box-shadow: 0 12px 28px rgba(22,24,29,.08); }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
  .mark { width: 21px; height: 21px; flex: none; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--surface); display: grid; place-items: center; }
  .opt input[type=checkbox] + .mark { border-radius: 6px; }
  .mark svg { opacity: 0; }
  .opt .txt { flex: 1; min-width: 0; font-family: 'Hanken Grotesk', sans-serif; font-size: 16.5px; font-weight: 500; letter-spacing: 0; line-height: 1.3; color: var(--ink); }
  .opt:has(input:checked) { background: rgba(214,86,40,.07); border-color: var(--accent); }
  .opt:has(input:checked) .txt { color: var(--ink); font-weight: 600; }
  .opt input:checked + .mark { background: var(--accent); border-color: var(--accent); }
  .opt input:checked + .mark svg { opacity: 1; }
  .opt:has(input:focus-visible) { outline: 3px solid #D65628; outline-offset: 2px; }
  .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 20px; max-width: 560px; }
  .field > label, .field .label { font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .field h1 { margin-bottom: 4px; }
  input[type=text], input[type=tel], input[type=number], input[type=month], select, textarea {
    width: 100%; min-height: 50px; padding: 13px 16px; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 11px; font: inherit; font-size: 16px; transition: border-color .18s ease;
  }
  input:focus, select:focus, textarea:focus { border-color: rgba(214,86,40,.6); }
  textarea { min-height: 120px; resize: vertical; }
  [aria-invalid=true] { border-color: var(--err) !important; }
  .err { color: var(--err); font-size: 15px; font-weight: 600; margin: 6px 0 0; }
  .count { font-size: 13.5px; color: var(--muted); text-align: right; margin: 0; }
  .row { display: flex; gap: 10px; }
  .row select { flex: none; width: 168px; font-size: 15px; }
  .check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--ink-2); line-height: 1.5; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
  .boxed { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 30px; border-radius: 11px; border: 1px solid transparent; font: inherit; font-size: 16.5px; font-weight: 600; cursor: pointer; text-decoration: none; transition: background .18s ease, transform .18s ease, border-color .18s ease; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #FFFFFF; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary[disabled] { opacity: .6; cursor: progress; transform: none; }
  .btn-secondary { background: var(--surface); color: var(--ink-2); border-color: var(--line); padding: 0 22px; font-size: 16px; }
  .btn-secondary:hover { border-color: var(--line-2); color: var(--ink); }
  .btn-wa { background: var(--ok); color: #FFFFFF; font-weight: 600; min-height: 56px; padding: 0 28px; }
  .btn-wa:hover { background: #275A42; }
  .link { background: none; border: 0; margin-top: 22px; padding: 8px 0; min-height: 44px; font: inherit; font-size: 14.5px; color: var(--muted); text-decoration: underline; cursor: pointer; align-self: flex-start; }
  .link:hover { color: var(--ink-2); }
  .note { font-size: 14px; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; }
  .card.hero { padding: clamp(24px,4vw,34px); background: linear-gradient(135deg, #FDF4EE, #FFFFFF 55%); border-color: rgba(214,86,40,.35); border-radius: 16px; }
  .eyebrow { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .card.hero .eyebrow { color: var(--accent); }
  .plan-name { font-family: 'Schibsted Grotesk', sans-serif; font-size: clamp(22px, 2.6vw, 27px); font-weight: 600; letter-spacing: -0.015em; margin: 0 0 8px; }
  .limit { padding: 14px 16px; background: rgba(224,179,65,.10); border: 1px solid rgba(224,179,65,.45); border-radius: 12px; font-size: 15.5px; }
  .quote { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; font-size: 15.5px; color: var(--ink-2); margin-bottom: 18px; }
  .status { padding: 13px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 15.5px; }
  .status.ok { background: rgba(52,211,153,.10); border: 1px solid rgba(52,211,153,.35); }
  .status.bad { background: #FDECEA; border: 1px solid #F1B8B3; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  @media (max-width: 560px) {
    .opts { grid-template-columns: 1fr; }
    .row { flex-direction: column; }
    .row select { width: 100%; }
    .btn { flex: 1 1 auto; }
  }
  /* ── o diagnóstico: leitura, antes e depois, sessão ── */
  .dx { margin: 22px 0 18px; }
  .dx-insight { margin: 0 0 18px; padding: 4px 0 4px 18px; border-left: 3px solid var(--accent); font-family: 'Schibsted Grotesk', sans-serif; font-size: clamp(18px, 2.2vw, 21px); font-weight: 500; line-height: 1.45; letter-spacing: -0.01em; color: var(--ink); max-width: 760px; }
  .dx-rows { list-style: none; margin: 0 0 14px; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .dx-head, .dx-rows li { display: grid; grid-template-columns: 1fr 34px 1.15fr; gap: 14px; align-items: center; padding: 14px 20px; }
  .dx-head { padding-top: 12px; padding-bottom: 12px; background: #FBFAF7; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .dx-head span:last-child { color: var(--accent); }
  .dx-rows li + li { border-top: 1px solid #F1EFEA; }
  .dx-today { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; line-height: 1.45; color: var(--muted); }
  .dx-today::before { content: ''; flex: none; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: #CFCAC1; }
  .dx-arrow { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: rgba(214,86,40,.08); }
  .dx-with { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; font-weight: 500; line-height: 1.45; color: var(--ink); }
  .dx-with .ck { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dx-session { padding: 20px 22px; border-radius: 16px; background: linear-gradient(135deg, #FDF4EE, #FFFFFF 70%); border: 1px solid rgba(214,86,40,.28); }
  .dx-session-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
  .dx-clock { flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #FFF; font-family: 'Schibsted Grotesk', sans-serif; font-weight: 600; font-size: 15px; box-shadow: 0 8px 22px rgba(185,71,31,.28); }
  .dx-session-t { margin: 0; font-family: 'Schibsted Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: var(--ink); }
  .dx-session-s { margin: 2px 0 0; font-size: 14.5px; color: var(--muted); }
  .dx-session ol { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 10px; }
  .dx-session li { counter-increment: s; display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; line-height: 1.45; color: var(--ink-2); }
  .dx-session li::before { content: counter(s); flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; background: #FFFFFF; border: 1px solid rgba(214,86,40,.35); color: var(--accent); font-size: 13px; font-weight: 600; }
  @media (max-width: 640px) {
    .dx-rows .dx-head { display: none; }
    .dx-rows li { grid-template-columns: 1fr; gap: 8px; }
    .dx-arrow { width: 26px; height: 26px; transform: rotate(90deg); }
  }

  /* ── the organization score ── */
  .org { margin: 0 0 18px; padding: 20px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .org-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .org-score { font-family: 'Schibsted Grotesk', sans-serif; font-size: clamp(30px, 4vw, 38px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .org-score small { font-size: .45em; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .org-label { margin: 0; font-family: 'Schibsted Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: var(--ink); }
  .org-meter { position: relative; height: 8px; margin: 14px 0 12px; border-radius: 99px; background: #EFECE6; overflow: hidden; }
  .org-meter i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: linear-gradient(90deg, #B9471F, #FF6A2C); transform-origin: left center; }
  .org-text { margin: 0; font-size: 15.5px; color: var(--ink-2); max-width: 680px; }

  /* ── premium plan card ── */
  .plan { position: relative; overflow: hidden; isolation: isolate; margin: 4px 0 16px; padding: clamp(24px, 4vw, 36px); border-radius: 20px; color: #F7F3EF;
    background: radial-gradient(120% 140% at 100% 0%, rgba(214,86,40,.30), transparent 55%), radial-gradient(90% 120% at 0% 100%, rgba(140,60,30,.35), transparent 60%), linear-gradient(160deg, #1C130F, #120E0C 62%);
    border: 1px solid rgba(214,86,40,.35); box-shadow: 0 30px 70px -28px rgba(22,24,29,.55), inset 0 1px 0 rgba(255,255,255,.06); }
  .plan::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.10) 50%, transparent 65%); transform: translateX(-130%); }
  .plan.sheen::after { animation: sheen 1.6s .6s cubic-bezier(.2,.7,.2,1) both; }
  .plan-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .plan-kicker { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #FF9A6B; }
  .plan-badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: #F7F3EF; background: rgba(214,86,40,.18); border: 1px solid rgba(255,122,61,.35); }
  .plan-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #FF7A3D; box-shadow: 0 0 0 4px rgba(255,122,61,.18); }

  .pp { display: flex; flex-direction: column; gap: 4px; padding: 18px 20px; background: rgba(14,11,9,.55); }
  .pp-l { font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #B3A79E; }
  .pp-v { font-family: 'Schibsted Grotesk', sans-serif; font-size: clamp(30px, 4.4vw, 42px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; color: #FFFFFF; white-space: nowrap; }
  .pp-v small { font-size: .42em; font-weight: 500; letter-spacing: 0; color: #CFC4BC; margin-left: 2px; }
  .pp-s { font-size: 13.5px; color: #B3A79E; }
  .plan-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; font-size: 14px; font-weight: 600; color: #0F2A1F; background: linear-gradient(135deg, #B8F0D2, #8FE3B8); }
  .plan-sep { height: 1px; margin: 22px 0 18px; background: linear-gradient(90deg, rgba(255,255,255,.14), rgba(255,255,255,.02)); }
  .plan-inc-h { margin: 0 0 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #B3A79E; }
  .plan-inc { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 18px; }
  .plan-inc li { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; line-height: 1.4; color: #EFE7E1; }
  .plan-inc li span.ck { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,122,61,.16); border: 1px solid rgba(255,122,61,.35); margin-top: -1px; }
  .plan-note { margin: 18px 0 0; font-size: 13.5px; color: #A3978E; }
  .pay { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: -4px 0 16px; }
  .pay-opt { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); }
  .pay-cash { background: rgba(143,227,184,.08); border-color: rgba(143,227,184,.45); }
  .pay-l { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #B3A79E; display: flex; align-items: center; gap: 8px; }
  .pay-cash .pay-l { color: #8FE3B8; }

  @media (max-width: 520px) { .pay { grid-template-columns: 1fr; } }
  .setup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 4px; }

<script>
(function () {

  function builderComposition() {
    var map = { pedido_conversa: 'conversation-order', site: 'ordering-site', mesa: 'table-service', recompra: 'customer-reactivation', relatorios: 'reports', fidelidade: 'loyalty', logistica: 'cenlo-delivery', cardapio_ia: 'menu-import' };
    var chosen = Array.isArray(state.answers.f16) ? state.answers.f16 : [];
    var modules = ['orders-core'];
    chosen.forEach(function(key) { if (map[key] && modules.indexOf(map[key]) < 0) modules.push(map[key]); });
    return { moduleIds: modules.sort(), preferences: [], units: state.answers.f3 === 'varias' && typeof state.answers.f3n === 'number' ? state.answers.f3n : 1, integration: state.answers.f15b === 'integrar' ? 'required' : state.answers.f15b === 'nao_sei' ? 'unknown' : 'none', priority: state.answers.f8 || 'pedidos' };
  }

    if (!Array.isArray(state.answers.f16)) return;
    var composition = builderComposition();
    var fingerprint = JSON.stringify(composition);
    // Revisiting unchanged answers must not erase a later manual configuration.
    if (read('cenlo-food-builder:diagnostic:v1') === fingerprint) return;

    state.contract.questions.forEach(function (q) {

    el.textContent = state.view === 'q' || state.view === 'intro' || state.view === 'clarify' ? 'Diagnóstico' : state.view === 'contact' || state.view === 'plan' || state.view === 'done' ? 'Os seus dados' : 'Resultado';
    var html = '';
    var before = segs.querySelectorAll('span.on').length;
    for (var i = 1; i <= total; i++) html += '<span class="' + (i <= at ? 'on' : '') + (i === at && at < total ? ' now' : '') + '"><i></i></span>';

  }
  var ARROW = '<svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m0 0-5.5-5.5M19 12l-5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  var BACK = '<svg class="arr" width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m0 0 5.5-5.5M5 12l5.5 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  var TICK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path pathLength="60" d="M5 12.5l4.5 4.5L19 7.5" stroke="#F7F5F1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  function primary(act, label, extra) {
    var busy = /…$/.test(label);

          g.fromTo(mark.querySelector('path'), { strokeDashoffset: 60 }, { strokeDashoffset: 0, duration: 0.4, ease: 'power2.out' });
          var ripple = document.createElement('span'); ripple.className = 'ripple';
          ripple.style.left = pick.x + 'px'; ripple.style.top = pick.y + 'px';
          label.appendChild(ripple);
          g.fromTo(ripple, { scale: 0, opacity: 1 }, { scale: (pick.w / 16) * 2.2, opacity: 0, duration: 0.9, ease: 'power2.out', onComplete: function () { ripple.remove(); } });
        }
      },
      segments: function (segs, before, at) {
        var g = G();
        if (!g) return;
        var spans = segs.querySelectorAll('span.on i');
        for (var i = before; i < at && i < spans.length; i++) g.fromTo(spans[i], { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'expo.out', delay: (i - before) * 0.06 });
      },
      ambient: function () {
        var g = G();
        if (!g) return;
        var blobs = document.querySelectorAll('.aura i');
        Array.prototype.forEach.call(blobs, function (b, i) {
          g.to(b, { xPercent: i % 2 ? -14 : 12, yPercent: i === 1 ? -10 : 9, scale: 1.12, duration: 12 + i * 4, ease: 'sine.inOut', yoyo: true, repeat: -1 });
        });

      },
    };
  })();
  app.addEventListener('pointerdown', fx.pick);
  if (document.readyState === 'complete') fx.ambient(); else window.addEventListener('load', fx.ambient);

  function go(view, opts) {
    state.view = view;
    if (view === 'contact') state.contact.consent = false;
    state.errors = {};
    state.banner = null;
    if (!(opts && opts.replace)) history.pushState({ view: view, screen: state.screen }, '');
    render(true);
  }

  window.addEventListener('popstate', function (e) {
    if (!e.state) return;
    state.view = e.state.view;
    if (state.view === 'contact') state.contact.consent = false;
    if (e.state.screen) state.screen = e.state.screen;
    state.errors = {};
    render(true);
  });

  /* ───── validation on the page (the server checks again) ───── */
  function checkScreen() {
    var errs = {};
    questionsOn(state.screen).forEach(function (q) {
      var v = state.answers[q.id];
      if (!q.required) return;
      if (q.kind === 'single' && !v) errs[q.id] = 'Selecione uma opção.';
      if (q.kind === 'multi') {
        var n = Array.isArray(v) ? v.length : 0;
        if (n < (q.minSelected || 1)) errs[q.id] = q.minSelected ? 'Selecione pelo menos ' + q.minSelected + ' opções.' : 'Selecione pelo menos uma opção.';
      }
      if (q.kind === 'text' && !(v && String(v).trim()) && !state.answers[q.id + 'Unknown']) errs[q.id] = q.unknownLabel ? 'Escreva o nome ou marque ' + q.unknownLabel + '.' : 'Preencha este campo.';
      if (q.kind === 'number' && !(Number.isInteger(Number(v)) && Number(v) >= (q.min || 0))) errs[q.id] = 'Informe um número inteiro a partir de ' + (q.min || 0) + '.';
    });
    return errs;
  }
  function showErrors(errs) {
    state.errors = errs;
    render(false);
    var first = Object.keys(errs)[0];
    var el = first && (document.getElementById('f-' + first) || app.querySelector('[data-q="' + first + '"]'));
    if (el) el.focus();
  }

  /* ───── talking to the CRM ───── */
  function post(path, body) {
    return fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'omit' })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (data) { return { status: res.status, data: data }; }); });
  }
  function event(type, value) {
    if (!state.token) return;
    var body = value ? { type: type, value: value } : { type: type };
    try { fetch(API + '/result/' + encodeURIComponent(state.token) + '/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true, credentials: 'omit' }); } catch (e) {}
  }

  var autonomousChecked = false;
  var autonomousEnabled = false;
  function askResult(previousToken) {
    if (!autonomousChecked) {
      state.busy = true; render(false);
      fetch(API + '/autonomous/status', { credentials: 'omit', cache: 'no-store' }).then(function(r) { if (!r.ok) throw new Error(); return r.json(); }).then(function(r) {
        autonomousChecked = true; autonomousEnabled = r.enabled === true; state.busy = false; askResult(previousToken);
      }).catch(function() { state.busy = false; state.banner = 'Não consegui conferir a oferta agora. Suas respostas continuam aqui. Tente novamente.'; render(false); });
      return;
    }
    if (autonomousEnabled) {
      try {
        var old = JSON.parse(sessionStorage.getItem('cenlo-food-autonomous:v1') || 'null');
        var same = old && JSON.stringify(old.answers) === JSON.stringify(state.answers);
        var journey = same ? old : { previousOfferId: old && old.offer ? old.offer.id : old ? old.previousOfferId : undefined, composition: builderComposition(), sessionKey: old ? old.sessionKey : state.autonomousSession, entry: 'diagnostic', answers: state.answers, isTest: new URLSearchParams(location.search).get('test') === '1', attribution: Object.assign({}, state.attribution, old ? old.attribution : {}) };
        sessionStorage.setItem('cenlo-food-autonomous:v1', JSON.stringify(journey));
        persist();
        var wantsDemo = Array.isArray(state.answers.f16) && state.answers.f16.indexOf('demo') >= 0;
        if (wantsDemo) { journey.compositionEdited = true; sessionStorage.setItem('cenlo-food-autonomous:v1', JSON.stringify(journey)); }
        location.assign(wantsDemo ? '/configurar?origem=diagnostico' : '/configurar/oferta');
      } catch(e) { state.banner = 'Não consegui guardar suas escolhas neste navegador. Permita o armazenamento para continuar com a mesma oferta.'; render(false); }
      return;
    }
    state.busy = true; state.banner = null; render(false);
    var body = { sessionKey: state.sessionKey, answers: state.answers, clarification: state.c1 || null, previousToken: previousToken || null, website: '', utm: utm() };
    post('/result', body).then(function (r) {
      state.busy = false;
      if (r.status === 200 && r.data.token) {
        state.token = r.data.token;
        state.followUp = {};
        state.receipt = null;
        if (r.data.clarification) { state.clarification = r.data.clarification; state.result = null; go('clarify'); return; }
        state.result = r.data.result;
        trackCustom('DiagnosticoConcluido', { plano: state.result.plan ? state.result.plan.key : 'avaliacao', estado: state.result.state, produto: 'food' });
        go('result');
        if (state.result.plan) event('price_shown');
        return;
      }
      if (r.status === 422 && r.data.field) {
        var q = state.contract.questions.filter(function (x) { return x.id === r.data.field; })[0];
        if (q) { state.screen = q.screen; state.view = 'q'; var e = {}; e[q.id] = r.data.message; showErrors(e); return; }
      }
      state.banner = 'Não deu para preparar a recomendação agora. As suas respostas continuam aqui. Tente de novo em instantes.';
      render(false);
    }).catch(function () {
      state.busy = false;
      state.banner = 'Sem conexão. As suas respostas continuam aqui. Confira a internet e tente de novo.';
      render(false);
    });
  }

  function localMessage() {
    var r = state.result, c = state.contact;
    var lines = ['Oi, Pedro. Fiz o diagnóstico do Cenlo Food e queria conversar com você.'];
    lines.push('Sou ' + c.firstName + ', do ' + c.business + '.');
    if (r && r.plan && r.state === 'recommended') lines.push('Vi a indicação do plano ' + r.plan.label + '.');
    else if (r && r.plan) lines.push('Vi o plano ' + r.plan.label + ' como referência.');
    return lines.join('\n\n');
  }

  function sendContact() {
    var c = state.contact, errs = {};
    if (!c.firstName || c.firstName.trim().length < 2) errs.firstName = 'Informe o seu primeiro nome.';
    if (!(c.business && c.business.trim().length >= 2)) errs.business = 'Informe o nome do restaurante.';
    if (!state.followUp.decision) errs.fd = 'Diga quem decide sobre isso.';
    if (!c.phone || c.phone.replace(/\D/g, '').length < 6) errs.phone = 'Informe o número de WhatsApp.';
    if (!c.consent) errs.consent = 'Confirme que podemos usar estes dados para responder ao seu pedido.';
    if (Object.keys(errs).length) return showErrors(errs);
    if (!state.followUp.submissionId) state.followUp.submissionId = 'web_' + id(20);
    var trap = app.querySelector('input[name=website]');
    var body = {
      token: state.token,
      submissionId: state.followUp.submissionId,
      followUp: { nextStep: state.followUp.nextStep, start: state.followUp.start || null, startMonth: state.followUp.start === 'adiante' ? state.followUp.startMonth || null : null, decision: state.followUp.decision || null, implementer: state.followUp.implementer || null },
      contact: { firstName: c.firstName, business: c.business, phone: c.phone, country: c.country || '351' },
      consent: true,
      website: trap ? trap.value : '',
      utm: utm(),
      pageUrl: location.origin + location.pathname,
      timezone: (Intl.DateTimeFormat().resolvedOptions().timeZone || null),
    };
    state.busy = true; state.banner = null; state.fallback = null; render(false);
    post('/contact', body).then(function (r) {
      state.busy = false;
      if (r.status === 201 && r.data.saved && r.data.submissionId === body.submissionId) {
        state.receipt = r.data;
        track('Lead', { content_name: 'diagnostico_food' });
        go('done');
        return;
      }
      if (r.status === 422 && r.data.field) { var e = {}; e[r.data.field === 'followUp' ? (/decide/.test(r.data.message || '') ? 'fd' : 'p2a') : r.data.field] = r.data.message; return showErrors(e); }
      if (r.status === 409) { var sc = visibleScreens(); state.banner = r.data.message || 'O resultado mudou. Veja a recomendação outra vez.'; state.token = null; state.view = 'q'; state.screen = sc[sc.length - 1]; render(true); return; }
      fail();
    }).catch(fail);
    function fail() {
      state.busy = false;
      state.banner = 'Não deu para salvar o pedido. Os seus dados continuam aqui. Tente de novo.';
      state.fallback = 'https://wa.me/' + WA_FALLBACK + '?text=' + encodeURIComponent(localMessage());
      render(false);
    }
  }

  /* ───── events ───── */
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.q && (t.type === 'radio' || t.type === 'checkbox')) {
      var qid = t.dataset.q;
      if (qid === 'c1') { state.c1 = { id: state.clarification.id, value: t.value }; persist(); return; }
      if (t.name.indexOf('fu-') === 0) {
        var map = { p1: 'choice', p1e: 'choice', pv: 'pv', p2: 'start', fd: 'decision', fi: 'implementer' };
        state.followUp[map[qid]] = t.value;
        delete state.errors[qid];
        if (qid === 'p1') { if (t.value !== 'valor') delete state.followUp.pv; render(false); }
        if (qid === 'p2') { if (t.value !== 'adiante') state.followUp.startMonth = null; render(false); }
        persist();
        var back2 = app.querySelector('input[data-q="' + qid + '"][value="' + t.value + '"]');
        if (back2) back2.focus();
        return;
      }
      if (t.type === 'radio') state.answers[qid] = t.value;
      else {
        var cur = Array.isArray(state.answers[qid]) ? state.answers[qid].slice() : [];
        if (t.checked) cur = t.dataset.exclusive ? [t.value] : cur.filter(function (v) { return !app.querySelector('input[data-q="' + qid + '"][value="' + v + '"][data-exclusive]'); }).concat([t.value]);
        else cur = cur.filter(function (v) { return v !== t.value; });
        state.answers[qid] = cur;
      }
      delete state.errors[qid];
      prune();
      render(false);
      var again = app.querySelector('input[data-q="' + qid + '"][value="' + t.value + '"]');
      if (again) again.focus();
      return;
    }
    if (t.dataset.unknown) {
      var id2 = t.dataset.unknown;
      if (t.checked) { state.answers[id2 + 'Unknown'] = true; delete state.answers[id2]; } else delete state.answers[id2 + 'Unknown'];
      render(false);
      var box = app.querySelector('[data-unknown="' + id2 + '"]'); if (box) box.focus();
      return;
    }
    if (t.dataset.c === 'consent' || t.dataset.c === 'captureConsent') {
      state.contact[t.dataset.c] = t.checked;
      persist();
    }
    if (t.dataset.c === 'country') { state.contact.country = t.value; persist(); }
    if (t.dataset.fu === 'startMonth') { state.followUp.startMonth = t.value || null; persist(); }
  });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.q && t.type !== 'checkbox' && t.type !== 'radio') {
      state.answers[t.dataset.q] = t.type === 'number' ? (t.value === '' ? '' : Number(t.value)) : t.value;
      var n = document.getElementById('count-' + t.dataset.q); if (n) n.textContent = t.value.length + ' de ' + t.maxLength;
      persist();
    }
    if (t.dataset.c && t.type !== 'checkbox' && t.tagName !== 'SELECT') { state.contact[t.dataset.c] = t.value; persist(); }
  });
  app.addEventListener('toggle', function(e) { if (e.target.dataset && e.target.dataset.extra) { if (app.contains(e.target)) state.detailsOpen[e.target.dataset.extra] = e.target.open; } }, true);
  app.addEventListener('submit', function (e) { e.preventDefault(); if (!state.busy) sendContact(); });
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    if (act === 'start') { journeyEvent('food_diagnostic_started'); trackCustom('DiagnosticoIniciado', { origem: document.referrer ? 'site' : 'link direto' }); state.screen = visibleScreens()[0]; go('q'); }
    if (act === 'next') {
      if (state.busy) return;
      var errs = checkScreen();
      if (Object.keys(errs).length) return showErrors(errs);
      var screens = visibleScreens(), at = screens.indexOf(state.screen);
      trackCustom('DiagnosticoPasso', { passo: at + 1 }); journeyEvent('food_diagnostic_step_completed', at + 1);
      if (at < screens.length - 1) { state.screen = screens[at + 1]; go('q'); }
      else { state.c1 = null; askResult(state.token); }
    }
    if (act === 'back') {
      var s = visibleScreens(), i = s.indexOf(state.screen);
      if (i > 0) { state.screen = s[i - 1]; go('q'); } else go('intro');
    }
    if (act === 'clarify') {
      if (!state.c1) return showErrors({ c1: 'Selecione uma opção.' });
      askResult(state.token);
    }
    if (act === 'edit') { state.screen = visibleScreens()[0]; go('q'); }
    if (act === 'p1') {
      var f = state.followUp, scope = state.result.nextStepKind === 'scope';
      if (!f.choice) return showErrors({ [scope ? 'p1e' : 'p1']: 'Escolha como prefere avançar.' });
      if (f.choice === 'valor' && !f.pv) return showErrors({ pv: 'Selecione uma opção.' });
      f.nextStep = f.choice === 'valor' ? f.pv : f.choice;
      event('next_step', f.nextStep);
      go(f.nextStep === 'nao_agora' ? 'ended' : 'contact');
    }
    if (act === 'capture' && !state.capturing) sendCapture();
    if (act === 'end') go('ended');
    if (act === 'clearStart') {
      state.followUp.start = null; state.followUp.startMonth = null; delete state.errors.p2a;
      render(false); persist();
      var firstStart = app.querySelector('input[data-q="p2"]'); if (firstStart) firstStart.focus();
    }
    if (act === 'toResult') go(state.result ? 'result' : 'intro');
    if (act === 'wa') { event('whatsapp_opened'); track('Contact', { content_name: 'whatsapp_diagnostico_food' }); }
    if (act === 'restart') {
      state.answers = {}; state.token = null; state.result = null; state.c1 = null; state.followUp = {}; state.receipt = null; state.clarification = null;
      state.contact = { country: '351' }; state.fallback = null; state.captured = null;
      try { sessionStorage.removeItem(CONTACT_STORE); } catch (e) {}
      state.sessionKey = id(24); state.autonomousSession = (read('cenlo-food-autonomous:v1', sessionStorage) || {}).sessionKey || crypto.randomUUID(); state.screen = 1; go('intro');
    }
  });

  fetch(API + '/questions', { credentials: 'omit' })
    .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
    .then(function (contract) {
      state.contract = contract;
      SCREENS = Array.from(new Set(contract.questions.map(function(q) { return q.screen; }))).sort();
      if (SCREENS.indexOf(state.screen) < 0) state.screen = SCREENS[SCREENS.length - 1];
      prune();
      history.replaceState({ view: state.view, screen: state.screen }, '');
      render(true);
    })
    .catch(function () {
      app.innerHTML = '<h1 data-focus>Não deu para abrir o diagnóstico.</h1><p class="lead">Confira a internet e tente de novo.</p><div class="actions"><button type="button" class="btn btn-primary" onclick="location.reload()">Tentar de novo</button></div>';
    });
})();
</script>
</body>
</html>
