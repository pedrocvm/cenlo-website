name: CI

# O deploy é feito automaticamente pela integração nativa Git da Vercel
# (push em main -> deploy de produção; PRs -> preview deployment).
# Este workflow serve apenas como gate de qualidade: garante que o código
# compila e passa no type-check antes/depois do merge. Não faz deploy,
# evitando duplicar o que a Vercel já faz sozinha.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  ci:
    name: Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build
